name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传未公开剧本、客户素材、账号信息或其他隐私数据。
  - type: input
    id: version
    attributes:
      label: 预见版本
      placeholder: 例如 v0.7.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 设备与系统
      placeholder: 例如 MacBook Pro M2，macOS 15.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序写出点击或拖动了什么。
      placeholder: |
        1. 添加一个人物和一匹马
        2. 将人物绑定到马匹
        3. 点击播放本场景
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: 截图、录屏或可公开的项目文件
      description: 可以直接拖入文件。上传前请确认不含隐私信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，没有发现相同问题。
          required: true
        - label: 我确认附件不含隐私或未授权公开的内容。
          required: true

